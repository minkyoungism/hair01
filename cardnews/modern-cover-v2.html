<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>민경이즘 · 모던 표지</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #9E9990;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px;
    }

    .card {
      width: 1080px;
      min-height: 1080px;
      background: #F8F7F5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px 80px 56px;
      gap: 32px;
      flex-shrink: 0;
    }

    /* 상단 작은 텍스트 */
    .top-label {
      font-size: 26px;
      font-weight: 400;
      color: #AAAAAA;
      letter-spacing: 0.04em;
      text-align: center;
    }

    /* 이미지 두 칸 */
    .img-row {
      display: flex;
      gap: 20px;
      width: 100%;
      height: 460px;
      flex-shrink: 0;
    }

    .img-box {
      flex: 1;
      background: #EDEAE6;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .mood-tag {
      position: absolute;
      bottom: 18px;
      left: 20px;
      font-size: 22px;
      font-weight: 700;
      padding: 8px 22px;
      border-radius: 100px;
    }
    .mood-tag.fem  { background: #EDE8E2; color: #888; }
    .mood-tag.mod  { background: #2C2C2C; color: #fff; }

    /* 구분선 */
    .line {
      width: 100%;
      height: 1px;
      background: #E4E0DB;
    }

    /* 제목 */
    .title-area {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .pre-text {
      font-size: 26px;
      font-weight: 400;
      color: #AAAAAA;
      letter-spacing: 0.02em;
    }

    .main-title {
      font-size: 80px;
      font-weight: 900;
      color: #1A1A1A;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .hl-bar {
      background: #8A78B8;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      padding: 12px 36px;
      border-radius: 12px;
      letter-spacing: 0.01em;
    }

    /* 핸들 */
    .handle {
      font-size: 22px;
      color: #C8C4BF;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-top: auto;
    }
  </style>
</head>
<body>
<div class="card">

  <div class="top-label">디자인 요소에 따라 같은 사람도 달라져요</div>

  <div class="img-row">
    <div class="img-box">
      <!-- <img src="feminin.png" /> -->
      <div class="mood-tag fem">패미닌</div>
    </div>
    <div class="img-box">
      <!-- <img src="modern.png" /> -->
      <div class="mood-tag mod">모던</div>
    </div>
  </div>

  <div class="line"></div>

  <div class="title-area">
    <div class="pre-text">사진으로 보면 비슷한데</div>
    <div class="main-title">심플한데<br/>왜 느낌이 다를까?</div>
    <div class="hl-bar">라인과 실루엣의 차이입니다</div>
  </div>

  <div class="handle">@minkyoungism</div>

</div>
</body>
</html>
