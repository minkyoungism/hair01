<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단발 실패 공통점 썸네일</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple:       #8A78B8;
      --purple-dark:  #6A58A0;
      --purple-light: #A898D0;
      --accent-pink:  #E8A3A3;
      --text-dark:    #1C1C1C;
      --text-sub:     #606060;
      --white:        #FFFFFF;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #9E9990;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
    }

    /* ════════════════════════════════════════════════════
       THUMBNAIL · 단발 실패 공통점 (인스타 릴스 9:16)
    ════════════════════════════════════════════════════ */
    .thumbnail {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: #FAFAF8;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 배경 이미지 (전체) */
    .img-section {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .img-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .img-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .img-placeholder {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(240, 235, 249, 0.8), rgba(248, 245, 253, 0.8));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--purple-light);
      font-size: 20px;
      font-weight: 500;
    }

    /* 오버레이 그레이디언트 */
    .overlay-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.1) 40%,
        rgba(0, 0, 0, 0.4) 70%,
        rgba(0, 0, 0, 0.6) 100%
      );
      pointer-events: none;
    }

    /* 텍스트 섹션 (오버레이) */
    .text-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 80px 60px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 28px;
      z-index: 10;
      text-align: center;
    }

    .main-title {
      text-align: center;
      font-size: 96px;
      font-weight: 900;
      color: var(--white);
      line-height: 1.05;
      letter-spacing: -0.05em;
      text-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      margin-bottom: 12px;
      max-width: 88%;
    }

    .sub-title {
      font-size: 44px;
      color: #ffffff;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-shadow: 0 7px 20px rgba(0, 0, 0, 0.55);
      margin-bottom: 18px;
      max-width: 84%;
    }

    .footer-text {
      font-size: 26px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 800;
      text-align: center;
      margin-top: 12px;
      letter-spacing: -0.01em;
      text-shadow: 0 5px 16px rgba(0, 0, 0, 0.4);
      max-width: 88%;
    }

    /* ════════════════════════════════════════════════════
       MOBILE RESPONSIVE
    ════════════════════════════════════════════════════ */
    @media (max-width: 1200px) {
      .thumbnail {
        width: 100%;
        height: auto;
        aspect-ratio: 9 / 16;
      }

      .main-title {
        font-size: 44px;
      }

      .point {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="thumbnail">
    <!-- 배경 이미지 -->
    <div class="img-section">
      <div class="img-container">
        <div class="img-box">
          <img id="mainImg" src="../08209655-149f-479f-a190-a2f25aea60cf.png" alt="단발 이미지" />
          <div class="img-placeholder" id="placeholder" style="display:none;">
            <span>📸</span>
            <span>단발 사진</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 오버레이 그레이디언트 -->
    <div class="overlay-gradient"></div>

    <!-- 텍스트 오버레이 -->
    <div class="text-section">
      <div class="main-title">
        끝 라인 하나로<br>
        단발이 망한다
      </div>
    </div>
  </div>

  <script>
    // 이미지 업로드 처리
    document.addEventListener('DOMContentLoaded', function() {
      const img = document.getElementById('mainImg');
      const placeholder = document.getElementById('placeholder');
      
      // 사진이 로드되면 placeholder 숨기기
      if (img.src) {
        img.style.display = 'block';
        placeholder.style.display = 'none';
      }
    });
  </script>
</body>
</html>
