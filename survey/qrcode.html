<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>minkyoungism QR코드</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #E8E3DC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .card {
      background: #F8F7F5;
      border-radius: 28px;
      padding: 44px 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    }

    .brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: #9E9990;
      margin-bottom: 6px;
    }

    .title {
      font-size: 17px;
      font-weight: 700;
      color: #2C2C2C;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 12px;
      color: #C4A882;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
    }

    .qr-wrap {
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    #qrcode canvas,
    #qrcode img {
      display: block;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: #EBD9C3;
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .desc {
      font-size: 13px;
      color: #2C2C2C;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .desc-sub {
      font-size: 11px;
      color: #888;
      line-height: 1.7;
      font-weight: 300;
    }

    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #EDEAE6;
      font-size: 10px;
      color: #BBB;
      letter-spacing: 0.08em;
    }

    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; border: 1px solid #EEE; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">minkyoungism</div>
    <div class="title">김민경 강사<br>헤어 스타일 수업</div>
    <div class="sub">교육만족도 조사</div>

    <div class="qr-wrap">
      <div id="qrcode"></div>
    </div>

    <div class="divider"></div>

    <div class="desc">📱 QR코드를 스캔해주세요</div>
    <div class="desc-sub">
      설문은 약 1~2분 소요됩니다<br>
      소중한 의견 감사합니다 🙏
    </div>

    <div class="footer">minkyoungism · 김민경 강사 · 교육만족도 설문</div>
  </div>

  <script>
    new QRCode(document.getElementById('qrcode'), {
      text: 'https://minkyoungism.github.io/hair01/survey/survey.html',
      width: 200,
      height: 200,
      colorDark: '#2C2C2C',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
